<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Portfolio Card</title>
  <style>
    body {
      background: #121212;
      color: #ffffff;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      width: 280px;
    }
    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
    }
    .skills span {
      background: #2a2a2a;
      display: inline-block;
      padding: 4px 8px;
      margin: 3px;
      border-radius: 4px;
      font-size: 12px;
    }
    a {
      color: #38bdf8;
      margin: 0 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="https://api.dicebear.com/7.x/bottts/svg?seed=Darshan" class="avatar" alt="Profile">
    <h2>Darshan</h2>
    <p style="color: #aaa; font-size: 14px;">First-year student learning C, cloud computing, and web dev.</p>
    
    <div class="skills">
      <span>C,Python</span>
      <span>Basics Canva</span>
      <span>HTML/CSS</span>
    </div>

    <div style="margin-top: 16px;">
      <a href="https://github.com" target="_blank">GitHub</a>
      <a href="https://linkedin.com" target="_blank">LinkedIn</a>
    </div>
  </div>

</body>
</html>
